schema: spec-driven

context: |
  Serpico is a police/civilian web app (React + TypeScript frontend, Go/Gin backend).
  Production deploys from main on Render (serpico-frontend, serpico-backend).
  Demo login: serpico / cops123. Helper APIs use ?userId= (CORS-safe), not X-User-Id.
  Frontend: React, Tailwind, Leaflet. Backend: Go, SQLite, RAG/AI chat.
  Match existing identifiers and patterns. Do not revive removed Chase Game / Pursue sim unless a spec says so.

