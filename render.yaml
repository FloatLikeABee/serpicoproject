# Render Blueprint — monorepo services
# After changing this file: Dashboard → Blueprints → Sync, or recreate from Blueprint.
# Production auto-deploys only from the linked branch (usually `main`) after merge.

services:
  # Main Frontend - Static Site
  - type: web
    name: serpico-frontend
    runtime: static
    rootDir: frontend
    branch: main
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
    buildCommand: npm config set registry https://registry.npmjs.org/ && sed -i 's|https://r2\.cnpmjs\.org|https://registry.npmjs.org|g' package-lock.json && sed -i 's|https://r\.cnpmjs\.org|https://registry.npmjs.org|g' package-lock.json && npm install --registry=https://registry.npmjs.org/ && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Set in Render dashboard to your backend URL

  # Admin Frontend - Static Site
  - type: web
    name: serpico-admin
    runtime: static
    rootDir: admin-frontend
    branch: main
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - admin-frontend/**
    buildCommand: npm config set registry https://registry.npmjs.org/ && sed -i 's|https://r2\.cnpmjs\.org|https://registry.npmjs.org|g' package-lock.json && sed -i 's|https://r\.cnpmjs\.org|https://registry.npmjs.org|g' package-lock.json && npm install --registry=https://registry.npmjs.org/ && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Set in Render dashboard to your backend URL

  # Backend - Web Service
  - type: web
    name: serpico-backend
    runtime: go
    rootDir: backend
    branch: main
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    buildCommand: go mod download && go build -o serpico .
    startCommand: ./serpico
    # Persist SQLite / Badger across deploys (ephemeral disk was wiping cases).
    disk:
      name: serpico-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false  # Set this in Render dashboard
      - key: GEMINI_DEFAULT_MODEL
        value: gemini-2.5-flash
      - key: RAG_DATA_PATH
        value: /var/data/rag
      - key: ENABLE_WEB_SEARCH
        value: "true"
      - key: ENABLE_DAILY_INTEL
        value: "true"
      - key: INTEL_DATA_PATH
        value: /var/data/intel
      - key: INTEL_INTERVAL_HOURS
        value: "12"
      - key: INTEL_PIECES_PER_RUN
        value: "2"
      - key: CHASE_GAME_MAX_ROUNDS
        value: "4"
      - key: IMAGE_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: dall-e-3
      - key: STABILITY_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
