services:
  # Main Frontend - Static Site
  - type: web
    name: serpico-frontend
    runtime: static
    buildCommand: cd frontend && npm config set registry https://registry.npmjs.org/ && sed -i 's|https://r2\.cnpmjs\.org|https://registry.npmjs.org|g' package-lock.json && sed -i 's|https://r\.cnpmjs\.org|https://registry.npmjs.org|g' package-lock.json && npm install --registry=https://registry.npmjs.org/ && npm run build
    staticPublishPath: ./frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Set this in Render dashboard to your backend URL

  # Admin Frontend - Static Site
  - type: web
    name: serpico-admin
    runtime: static
    buildCommand: cd admin-frontend && npm config set registry https://registry.npmjs.org/ && sed -i 's|https://r2\.cnpmjs\.org|https://registry.npmjs.org|g' package-lock.json && sed -i 's|https://r\.cnpmjs\.org|https://registry.npmjs.org|g' package-lock.json && npm install --registry=https://registry.npmjs.org/ && npm run build
    staticPublishPath: ./admin-frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Set this in Render dashboard to your backend URL

  # Backend - Web Service
  - type: web
    name: serpico-backend
    env: go
    buildCommand: cd backend && go mod download && go build -o serpico .
    startCommand: ./serpico
    envVars:
      - key: PORT
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false  # Set this in Render dashboard
      - key: GEMINI_DEFAULT_MODEL
        value: gemini-2.5-flash
      - key: RAG_DATA_PATH
        value: ./data/rag
      - key: ENABLE_WEB_SEARCH
        value: "true"
      - key: CHASE_GAME_MAX_ROUNDS
        value: "4"
      - key: IMAGE_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: dall-e-3
      - key: STABILITY_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false

